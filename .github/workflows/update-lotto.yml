name: Update Lotto Numbers

on:
  schedule:
    # 매주 토요일 밤 10시 (한국 시간 기준)
    # KST 22:00 = UTC 13:00
    - cron: '0 13 * * 6'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 활성화

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 워크플로우에 Git push 권한을 부여
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 데이터 업데이트 스크립트 실행
        run: |
          python update_lotto.py

      - name: 변경사항 저장 및 푸시 (Git Push)
        run: |
          git config --global user.name 'Lotto Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add public/data/lotto_results.csv
          # 변경사항이 있는 경우에만 커밋하고 푸시
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: auto-update lotto numbers $(date +'%Y-%m-%d')" && git push)
